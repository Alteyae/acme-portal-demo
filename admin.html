<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Console — Acme Health Systems</title>
<!-- Reminder: default creds were changed in prod. Do NOT leave the demo account (demo/demo) enabled. -->
<style>
  body { margin:0; background:#1b1f27; color:#e7e9ee; font:15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif; }
  .box { max-width:360px; margin:12vh auto; background:#232834; border:1px solid #333a48; border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#9aa3b2; font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:13px; margin:14px 0 6px; color:#c3c9d4; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #3a4152; background:#1b1f27; color:#e7e9ee; }
  button { width:100%; margin-top:20px; padding:11px; border:0; border-radius:8px; background:#1E5FA8; color:#fff; font-weight:600; cursor:pointer; }
  .warn { margin-top:18px; font-size:12px; color:#9aa3b2; }
</style>
</head>
<body>
<div class="box">
  <h1>Admin Console</h1>
  <p class="sub">AcmePortal 2.3.1 · restricted access</p>
  <label for="u">Username</label>
  <input id="u" type="text" autocomplete="off">
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="off">
  <button type="button">Sign in</button>
  <p class="warn">Authorized administrators only. Access is logged.</p>
</div>
</body>
</html>
